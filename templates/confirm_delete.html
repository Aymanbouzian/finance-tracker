{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card shadow-sm border-danger">
      <div class="card-body">
        <h1 class="h4">{{ title }}</h1>
        <p>Delete <strong>{{ object }}</strong>? This cannot be undone.</p>
        {% if warning %}<p class="text-danger">{{ warning }}</p>{% endif %}
        <form method="post">
          {% csrf_token %}
          <button class="btn btn-danger">Yes, delete</button>
          <a class="btn btn-link" href="{{ cancel_url|default:'/' }}">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
