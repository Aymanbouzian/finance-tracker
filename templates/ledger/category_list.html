{% extends "base.html" %}
{% block title %}Categories{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0">Categories</h1>
  <a class="btn btn-primary" href="{% url 'category-create' %}">+ New category</a>
</div>
<div class="card shadow-sm"><div class="card-body">
  <table class="table align-middle mb-0">
    <thead><tr><th>Name</th><th>Type</th><th></th></tr></thead>
    <tbody>
    {% for category in categories %}
      <tr>
        <td>{{ category.name }}</td>
        <td><span class="badge text-bg-{% if category.kind == 'income' %}success{% else %}secondary{% endif %}">{{ category.get_kind_display }}</span></td>
        <td class="text-end"><a class="btn btn-sm btn-outline-danger" href="{% url 'category-delete' category.pk %}">Delete</a></td>
      </tr>
    {% empty %}
      <tr><td colspan="3" class="text-muted">No categories yet.</td></tr>
    {% endfor %}
    </tbody>
  </table>
</div></div>
{% endblock %}
