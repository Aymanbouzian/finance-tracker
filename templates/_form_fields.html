{% for error in form.non_field_errors %}<div class="alert alert-danger">{{ error }}</div>{% endfor %}
{% for field in form %}
  <div class="mb-3" id="wrap-{{ field.html_name }}">
    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<div class="form-text" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</div>{% endif %}
    {% if field.errors %}<div class="text-danger small" id="{{ field.auto_id }}_error">{{ field.errors }}</div>{% endif %}
  </div>
{% endfor %}
